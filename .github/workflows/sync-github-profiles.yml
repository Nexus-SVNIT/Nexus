name: Sync GitHub Profiles Leaderboard

on:
  schedule:
    # Runs daily at 00:00 UTC (5:30 AM IST)
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync-github-leaderboard:
    name: Sync GitHub Contributions Leaderboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install server dependencies
        run: |
          cd server
          npm install --omit=dev

      - name: Run GitHub profiles synchronization
        env:
          MONGO_URL: ${{ secrets.MONGO_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node server/scripts/syncGitHubProfiles.js
